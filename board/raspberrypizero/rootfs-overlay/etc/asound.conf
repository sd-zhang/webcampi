# Capture the left I2S slot only. The right slot is undriven by this mic.
# Preserve S32 precision through routing; filter before final S16 conversion.
pcm.pisight_mic {
    type pisight_voice
    slave.pcm "pisight_mic_raw"
}

pcm.pisight_mic_raw {
    type route
    slave {
        pcm "hw:CARD=PiSightMic,DEV=0"
        channels 2
        format S32_LE
    }
    ttable.0.0 1
}
